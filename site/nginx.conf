server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;

    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ $uri/index.html =404;
    }

    # The plates only (/bilder/ itself is the gallery page). Their file names
    # carry no hash, so they are cached for a month, not forever.
    location ~ ^/bilder/(gross|klein)/ {
        include /etc/nginx/security-headers.conf;
        expires 30d;
    }

    # Astro's bundles are content-hashed.
    location /_astro/ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    error_page 404 /404.html;
}
