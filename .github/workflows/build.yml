name: build

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Prepare the content from the original document
        run: python3 tools/pipeline.py

      - name: Install
        working-directory: site
        run: npm ci

      - name: Build and test          # `prebuild` optimises the images
        working-directory: site
        run: |
          npx playwright install --with-deps chromium
          npm test

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: site/dist
